id = "brightscript"
name = "BrightScript / BrighterScript"
version = "0.1.0"
schema_version = 1
description = "BrightScript and BrighterScript language support for Zed: tree-sitter highlighting, the BrighterScript language server, and Roku build/sideload commands."
authors = ["Cristobal Ovalle"]
repository = "https://github.com/cristobal-ovalle/zed-brightscript-language"
languages = ["languages/brightscript", "languages/brighter-script", "languages/scenegraph-xml"]

[language_servers.brighterscript]
code_action_kinds = ["QuickFix"]

[grammars.brightscript]
repository = "file://grammars/tree-sitter-brightscript"
rev = "main"

[grammars.brighterscript]
repository = "file://grammars/tree-sitter-brighterscript"
rev = "main"

[grammars.roku_xml]
repository = "file://grammars/tree-sitter-roku-xml"
rev = "main"
