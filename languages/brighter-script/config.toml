name = "BrighterScript"
grammar = "brighter-script"
path_suffixes = ["bs", "d.bs"]
line_comments = ["' ", "rem "]
autoclose_before = "]})\"'`"
brackets = [
    { start = "(", end = ")", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "{", end = "}", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = [
        "comment",
        "string",
    ] },
    { start = "'", end = "'", close = true, newline = false, not_in = [
        "comment",
        "string",
    ] },
    { start = "`", end = "`", close = true, newline = true, not_in = [
        "comment",
        "string",
    ] },
]
tab_size = 4
increase_indent_pattern = '(^\s*(sub|function|for|while|do|class|interface|enum|namespace)\b.*|^\s*(public|protected|private)\b.*|^\s*if\b.*\bthen\s*$|^\s*(else|elseif)\b.*|^\s*try\s*$|^\s*catch\b.*)'
decrease_indent_pattern = '^\s*(end( sub| function| if| for| while| try| class| interface| enum| namespace)?|else|elseif|catch|next|until|loop)\b.*$'
collapsed_placeholder = "' ..."
debuggers = ["roku-debug"]
