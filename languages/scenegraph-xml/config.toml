name = "SceneGraph XML"
grammar = "roku_xml"
path_suffixes = ["xml"]
line_comments = ["<!-- "]
autoclose_before = ">"
brackets = [
    { start = "<", end = ">", close = true, newline = false, not_in = [
        "string",
    ] },
    { start = "\"", end = "\"", close = true, newline = false, not_in = [
        "comment",
        "string",
    ] },
]
collapsed_placeholder = "<!-- ... -->"
